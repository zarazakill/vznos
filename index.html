// ЮРИДИЧЕСКИЙ БЛОК: СОГЛАСИЕ НА ОБРАБОТКУ ПЕРСОНАЛЬНЫХ ДАННЫХ
// ПОЛНОСТЬЮ СООТВЕТСТВУЕТ ConsentActivity.kt И ФЗ-152
// ==============================================================

const CONSENT_VERSION = "1.0";
const CONSENT_STORAGE_KEY = "snt_consent_accepted";
const CONSENT_VERSION_KEY = "snt_consent_version";

// Проверка, принято ли согласие
function isConsentAccepted() {
    const accepted = localStorage.getItem(CONSENT_STORAGE_KEY) === "true";
    const version = localStorage.getItem(CONSENT_VERSION_KEY);
    return accepted && version === CONSENT_VERSION;
}

// Сохранение согласия
function saveConsent() {
    localStorage.setItem(CONSENT_STORAGE_KEY, "true");
    localStorage.setItem(CONSENT_VERSION_KEY, CONSENT_VERSION);
    localStorage.setItem("snt_consent_timestamp", Date.now().toString());
}

// Отзыв согласия (очистка данных)
function revokeConsent() {
    localStorage.removeItem(CONSENT_STORAGE_KEY);
    localStorage.removeItem(CONSENT_VERSION_KEY);
    localStorage.removeItem("snt_consent_timestamp");

    // Очистка кеша данных
    cachedDebtMap.clear();
    cachedElectricityMap.clear();

    // Перезагрузка страницы для показа экрана согласия
    location.reload();
}

const EE_URL = "https://raw.githubusercontent.com/zarazakill/vznos/main/ee.xlsx";

function formatMoney(amount) {
    return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
}

function formatNumber(v) {
    return v % 1 === 0 ? v.toString() : v.toFixed(2);
}

function numberToWords(amount) {
    let rub = Math.floor(amount);
    let kop = Math.round((amount - rub) * 100);
    let rubWord = "";
    if (rub % 100 >= 11 && rub % 100 <= 19) rubWord = "рублей";
    else if (rub % 10 === 1) rubWord = "рубль";
    else if (rub % 10 >= 2 && rub % 10 <= 4) rubWord = "рубля";
    else rubWord = "рублей";
    return `${rub} ${rubWord} ${kop.toString().padStart(2, '0')} копеек`;
}

async function fetchFile(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.arrayBuffer();
}

function isPlotNumber(s) {
    return s.trim().match(/^\d{1,3}[а-яёa-z]?$/i) !== null;
}

function parseNumber(val) {
    if (val === undefined || val === null) return 0;
    const s = val.toString().replace(",", ".").replace(/[^\d.-]/g, '');
    if (s === "") return 0;
    const num = parseFloat(s);
    return isNaN(num) ? 0 : num;
}

// ==============================================================
// ПАРСИНГ DEBIT.XLSX (ПО АНАЛОГУ С ANDROID)
// ==============================================================
async function parseDebitFile(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false, defval: '' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    const debtMap = new Map();

    let colPlot = 0;
    let colOwner = 1;
    let colDebt = 7;
    let colOverpay = 8;

    let headerFound = false;
    let dataStarted = false;
    let currentDebtRecord = null;

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        const col0 = (row[colPlot] || "").toString().trim();
        const col0lower = col0.toLowerCase();

        // 1. Поиск заголовка
        if (!headerFound) {
            const joined = row.join(" ").toLowerCase();
            if (joined.includes("владельц") || joined.includes("номер")) {
                row.forEach((val, idx) => {
                    const v = (val || "").toString().toLowerCase();
                    if (v === "номер" || v === "№") colPlot = idx;
                    if (v.includes("владельц")) colOwner = idx;
                });
                headerFound = true;
            }
            continue;
        }

        // 2. Пропуск служебных строк до начала данных
        if (!dataStarted) {
            if (isPlotNumber(col0)) {
                dataStarted = true;
            } else {
                continue;
            }
        }

        // 3. Конец данных
        if (col0lower === "итого" || col0lower.startsWith("итог")) break;

        // 4. Пропускаем пустые строки
        if (col0 === "") continue;

        // Проверяем, является ли строка строкой участка
        const isPlotRow = isPlotNumber(col0) && row[colOwner] && row[colOwner].toString().trim() !== "";

        if (isPlotRow) {
            // Сохраняем предыдущий участок
            if (currentDebtRecord) {
                if (currentDebtRecord.totalDebt > 0.01) {
                    debtMap.set(currentDebtRecord.plotNumber, currentDebtRecord);
                }
            }

            // Начинаем новый участок
            const plotKey = col0.toLowerCase();
            const owner = (row[colOwner] || "").toString().trim();
            const debtOnEnd = parseNumber(row[colDebt]);
            const overpayEnd = parseNumber(row[colOverpay]);

            currentDebtRecord = {
                plotNumber: plotKey,
                owner: owner,
                totalDebt: debtOnEnd,
                overpayEnd: overpayEnd,
                hasDebt: debtOnEnd > 0.01,
                hasOverpayment: overpayEnd > 0.01,
                membershipDebt: 0,
                targetDebt: 0,
                arrearsDebt: 0,
                workDebt: 0,
                electricityDebt: 0,
                details: []
            };
        } else if (currentDebtRecord && col0 !== "") {
            // Это строка детализации (категория + сумма)
            const categoryName = col0;
            const amount = parseNumber(row[colDebt]);

            if (amount > 0.01) {
                let detail = null;
                if (categoryName.includes("Членские взносы")) {
                    currentDebtRecord.membershipDebt += amount;
                    detail = { label: categoryName, amount: amount, cat: "membership" };
                } else if (categoryName.includes("Целевые") && !categoryName.includes("взносы")) {
                    currentDebtRecord.targetDebt += amount;
                    detail = { label: categoryName, amount: amount, cat: "target" };
                } else if (categoryName.includes("Целевые взносы")) {
                    currentDebtRecord.targetDebt += amount;
                    detail = { label: categoryName, amount: amount, cat: "target" };
                } else if (categoryName.includes("Задолженность прошлых лет") &&
                           !categoryName.includes("Отработка") &&
                           !categoryName.includes("Целевые")) {
                    currentDebtRecord.arrearsDebt += amount;
                    detail = { label: categoryName, amount: amount, cat: "arrears" };
                } else if (categoryName.includes("Отработка")) {
                    currentDebtRecord.workDebt += amount;
                    detail = { label: categoryName, amount: amount, cat: "work" };
                } else if (categoryName.includes("Электроэнергия")) {
                    currentDebtRecord.electricityDebt += amount;
                    detail = { label: categoryName, amount: amount, cat: "electricity" };
                }

                if (detail) {
                    currentDebtRecord.details.push(detail);
                }
            }
        }
    }

    // Сохраняем последний участок
    if (currentDebtRecord && currentDebtRecord.totalDebt > 0.01) {
        debtMap.set(currentDebtRecord.plotNumber, currentDebtRecord);
    }

    console.log(`Загружено ${debtMap.size} участков с задолженностью`);
    return debtMap;
}

// ==============================================================
// ПАРСИНГ EE.XLSX (ЭЛЕКТРОЭНЕРГИЯ)
// ==============================================================
async function parseElectricityFile(arrayBuffer) {
    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: false, defval: '' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    const eeMap = new Map();
    let headerFound = false;

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        const col0 = (row[0] || "").toString().trim();

        if (!headerFound) {
            const c0l = col0.toLowerCase();
            if (c0l.includes("участок") || c0l.includes("номер") || c0l === "№" || isPlotNumber(col0)) {
                headerFound = true;
                if (!isPlotNumber(col0)) continue;
            } else continue;
        }

        if (!isPlotNumber(col0)) continue;

        const plotKey = col0.toLowerCase();
        const owner = (row[1] || "").toString().trim();
        const readingDateStr = (row[4] || "").toString().trim();
        const currentReading = parseNumber(row[6]);

        eeMap.set(plotKey, {
            plotNumber: plotKey,
            owner: owner,
            currentReading: currentReading,
            readingDateStr: readingDateStr,
            tariff: TARIFF,
            calculateAmountFromNewReading: function(newReading) {
                if (newReading <= this.currentReading) return 0;
                return (newReading - this.currentReading) * this.tariff;
            }
        });
    }

    console.log(`EE загружено: ${eeMap.size} записей`);
    return eeMap;
}

// QR-КОДЫ (СТАНДАРТ СБП)

async function generateQR(text) {
    return await QRCode.toDataURL(text, { width: 280, margin: 1, errorCorrectionLevel: 'H' });
}

function buildPaymentQR(plotNumber, amount, purpose, isElectricity = false) {
    const sumKop = Math.round(amount * 100);
    const finalPurpose = isElectricity
        ? `Оплата электроэнергии уч.${plotNumber}`
        : purpose || `Оплата взносов уч.${plotNumber}`;
    return `ST00012|Name=${ORGANIZATION}|PersonalAcc=${PERSONAL_ACC}|BankName=${BANK_NAME}|BIC=${BIC}|CorrespAcc=${CORRESP_ACC}|PayeeINN=${INN}|Purpose=${finalPurpose}|Sum=${sumKop}`;
}

// ОСНОВНАЯ ЛОГИКА ЗАГРУЗКИ ДАННЫХ
// ==============================================================
async function loadPlotData(plotNumber) {
    const normalized = plotNumber.trim().toLowerCase();
    const debtContainer = document.getElementById("debtCard");
    const eeContainer = document.getElementById("electricityCard");
    const notFoundDiv = document.getElementById("notFoundBlock");
    const loadingDiv = document.getElementById("loadingIndicator");
    const errorDiv = document.getElementById("errorMessage");

    debtContainer.classList.add("hidden");
    eeContainer.classList.add("hidden");
    notFoundDiv.classList.add("hidden");
    errorDiv.classList.add("hidden");
    loadingDiv.classList.remove("hidden");

    try {
        if (cachedDebtMap.size === 0) {
            loadingDiv.innerHTML = "☁️ Загрузка данных по долгам...";
            const debtBuffer = await fetchFile(DEBIT_URL);
            cachedDebtMap = await parseDebitFile(debtBuffer);

            loadingDiv.innerHTML = "⚡ Загрузка данных электроэнергии...";
            const eeBuffer = await fetchFile(EE_URL);
            cachedElectricityMap = await parseElectricityFile(eeBuffer);
        }

        loadingDiv.classList.add("hidden");

        const debtData = cachedDebtMap.get(normalized);
        const eeData = cachedElectricityMap.get(normalized);

        if (!debtData && !eeData) {
            notFoundDiv.classList.remove("hidden");
            return;
        }

        if (debtData) renderDebtCard(debtData);
        else debtContainer.classList.add("hidden");

        if (eeData) renderElectricityCard(eeData);
        else eeContainer.classList.add("hidden");

    } catch (err) {
        loadingDiv.classList.add("hidden");
        errorDiv.innerHTML = `❌ Ошибка загрузки: ${err.message}. Проверьте интернет.`;
        errorDiv.classList.remove("hidden");
        console.error(err);
    }
}

function renderDebtCard(debt) {

            <div class="card-header">💰 Задолженность</div>
            <div style="font-size:13px; color:var(--gray-500);">Участок №${debt.plotNumber}</div>
            <div class="plot-owner">${debt.owner || "Владелец не указан"}</div>
    `;

    if (debt.hasDebt) {
        html += `<div class="debt-total amount-red">Задолженность: ${formatMoney(debt.totalDebt)} ₽</div>`;

        // Детализация по категориям
        html += `<div style="margin-top: 8px;">`;
        if (debt.membershipDebt > 0.01) {
            html += `<div class="debt-line"><span>Членские взносы:</span><span class="amount-red">${formatMoney(debt.membershipDebt)} ₽</span></div>`;
        }
        if (debt.targetDebt > 0.01) {
            html += `<div class="debt-line"><span>Целевые взносы:</span><span class="amount-red">${formatMoney(debt.targetDebt)} ₽</span></div>`;
        }
        if (debt.arrearsDebt > 0.01) {
            html += `<div class="debt-line"><span>Задолженность прошлых лет:</span><span class="amount-red">${formatMoney(debt.arrearsDebt)} ₽</span></div>`;
        }
        if (debt.workDebt > 0.01) {
            html += `<div class="debt-line"><span>Отработка:</span><span class="amount-red">${formatMoney(debt.workDebt)} ₽</span></div>`;
        }
        if (debt.electricityDebt > 0.01) {
            html += `<div class="debt-line"><span>Электроэнергия:</span><span class="amount-red">${formatMoney(debt.electricityDebt)} ₽</span></div>`;
        }
        html += `</div>`;

        html += `<div style="font-size:12px; margin:10px 0;">Прописью: ${numberToWords(debt.totalDebt)}</div>`;

        const qrText = buildPaymentQR(debt.plotNumber, debt.totalDebt, `Оплата взносов уч.${debt.plotNumber}`, false);
        html += `
            <button class="qr-btn" onclick="generateAndShowQR('debt', this, '${qrText.replace(/'/g, "\\'")}')">📱 Сгенерировать QR для оплаты</button>
            <div id="debtQrContainer" style="text-align:center;"></div>
            <div id="debtQrButtons" style="display:none;" class="qr-group">
                <button onclick="shareQR('debtQrImg')">↗ Поделиться</button>
                <button onclick="saveQR('debtQrImg')">💾 Сохранить</button>
            </div>
        `;
    } else if (debt.hasOverpayment) {
        html += `<div class="debt-total amount-green">Переплата: ${formatMoney(debt.overpayEnd)} ₽</div>`;
    } else {
        html += `<div class="debt-total amount-green">✓ Задолженностей нет</div>`;
    }

    html += `</div>`;
    container.innerHTML = html;
}

// ОТРИСОВКА КАРТОЧКИ ЭЛЕКТРОЭНЕРГИИ
// ==============================================================
function renderElectricityCard(ee) {
    const container = document.getElementById("electricityCard");
    container.classList.remove("hidden");

    let html = `
        <div class="card-content">
            <div class="card-header">⚡ Электроэнергия</div>
            <div style="font-size:13px;">Участок №${ee.plotNumber}</div>
            <div class="plot-owner">${ee.owner || "Владелец не указан"}</div>
            <div style="display:flex; justify-content:space-between; margin:8px 0;">
                <span>Текущие показания:</span>
                <strong>${formatNumber(ee.currentReading)} кВт·ч</strong>
            </div>
            <div style="font-size:12px; color:gray;">Дата: ${ee.readingDateStr || "не указана"}</div>
            <div style="font-size:12px; margin:4px 0 12px;">💰 Тариф: ${TARIFF.toFixed(2)} ₽/кВт·ч</div>

            <input type="number" id="newReadingInput" class="reading-input" placeholder="Введите новые показания" step="any">
            <div id="calcAmountBlock" class="calculated-amount hidden"></div>
            <button id="genEeQrBtn" class="qr-btn" disabled style="background:var(--blue-600);">📱 Сгенерировать QR для оплаты э/э</button>
            <div id="eeQrContainer" style="text-align:center;"></div>
            <div id="eeQrButtons" style="display:none;" class="qr-group">
                <button onclick="shareQR('eeQrImg')">↗ Поделиться</button>
                <button onclick="saveQR('eeQrImg')">💾 Сохранить</button>
            </div>
        </div>
    `;
    container.innerHTML = html;

    const input = document.getElementById("newReadingInput");
    const calcBlock = document.getElementById("calcAmountBlock");
    const genBtn = document.getElementById("genEeQrBtn");

    input.addEventListener("input", function() {
        const newVal = parseFloat(this.value);
        if (isNaN(newVal) || newVal <= ee.currentReading) {
            calcBlock.classList.add("hidden");
            genBtn.disabled = true;
            return;
        }
        const amount = (newVal - ee.currentReading) * TARIFF;
        calcBlock.innerHTML = `📊 Сумма к оплате: ${formatMoney(amount)} ₽`;
        calcBlock.classList.remove("hidden");
        genBtn.disabled = false;

        genBtn.onclick = async () => {
            const qrText = buildPaymentQR(ee.plotNumber, amount, `Электроэнергия уч.${ee.plotNumber} (${newVal} кВт·ч)`, true);
            generateAndShowQR('ee', genBtn, qrText);
        };
    });
}

// ==============================================================
// ГЛОБАЛЬНЫЕ ФУНКЦИИ ДЛЯ QR
// ==============================================================
window.generateAndShowQR = async function(type, btn, qrText) {
    const containerId = type === 'debt' ? 'debtQrContainer' : 'eeQrContainer';
    const btnGroupId = type === 'debt' ? 'debtQrButtons' : 'eeQrButtons';
    const container = document.getElementById(containerId);
    const oldImg = document.getElementById(`${type}QrImg`);
    if (oldImg) oldImg.remove();

    btn.innerText = "⏳ Генерация...";
    btn.disabled = true;

    try {
        const qrDataUrl = await generateQR(qrText);
        const img = document.createElement('img');
        img.id = `${type}QrImg`;
        img.src = qrDataUrl;
        img.className = "qr-image";
        container.appendChild(img);
        document.getElementById(btnGroupId).style.display = "flex";
    } catch(e) { alert("Ошибка QR: " + e.message); }
    finally { btn.innerText = type === 'debt' ? "Обновить QR" : "Сгенерировать QR"; btn.disabled = false; }
};

window.shareQR = function(imgId) {
    const img = document.getElementById(imgId);
    if (!img) return;
    fetch(img.src)
        .then(res => res.blob())
        .then(blob => {
            const file = new File([blob], "qr.png", { type: "image/png" });
            if (navigator.share) navigator.share({ files: [file], title: "QR-код оплаты" });
            else {
                const link = document.createElement('a');
                link.download = "qr_payment.png";
                link.href = img.src;
                link.click();
            }
        });
};

window.saveQR = function(imgId) {
    const img = document.getElementById(imgId);
    if (!img) return;
    const link = document.createElement('a');
    link.download = "qr_payment.png";
    link.href = img.src;
    link.click();
};

        if (e.key === "Enter") document.getElementById("searchBtn").click();
    });

    // Автоматическая загрузка данных при первом открытии
    loadPlotData("");
}

// ==============================================================
// СТАРТ: ПРОВЕРКА СОГЛАСИЯ
// ==============================================================
if (isConsentAccepted()) {
    document.getElementById('mainApp').style.display = '';
    initMainApp();
} else {
    showConsentScreen();
}
</script>
