<!DOCTYPE html>

<head>

    <style>

            padding: 0;
            box-sizing: border-box;

        }

        :root {
            --green-50: #F1F8E9;

            --green-600: #388E3C;

        .search-title { font-weight: bold; font-size: 16px; margin: 5px 0 15px 0; }

<body>

<div id="mainApp" style="display: none;">
    <div class="app-header">
        <h1>🌿 СНТ «Берёзка-2»</h1>
        <p>Взносы и задолженности</p>
        <button class="settings-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="search-card">
        <div class="search-label">ПОИСК УЧАСТКА</div>
        <div class="search-title">Введите номер вашего участка</div>
        <div class="search-input-group">
            <input type="text" id="plotInput" class="search-input" placeholder="Например: 5, 4а, 10а" autocomplete="off" inputmode="text">
            <button id="searchBtn" class="search-btn">Найти</button>
        </div>
    </div>

    <div id="loadingIndicator" class="loading-state hidden">☁️ Загрузка данных...</div>
    <div id="errorMessage" class="error-state hidden"></div>
    <div id="debtCard" class="card hidden"></div>
    <div id="electricityCard" class="card hidden"></div>
    <div id="notFoundBlock" class="not-found hidden">🔍 Участок не найден в базе. Проверьте номер.</div>
    <div class="footer-note">⚡ Данные синхронизируются при каждом поиске</div>
</div>

<script>
// ==============================================================
// 1. КОНСТАНТЫ И ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (Android-совместимость)
// ==============================================================
const CONSENT_VERSION = "1.0";
const CONSENT_STORAGE_KEY = "snt_consent_accepted";
const CONSENT_VERSION_KEY = "snt_consent_version";
const TARIFF = 3.82;
const ORGANIZATION = "СНТ «Берёзка-2»";
const INN = "5433118499";
const PERSONAL_ACC = "40703810644050040322";
const BANK_NAME = "Сибирский Банк ПАО Сбербанк г. Новосибирск";
const BIC = "045004641";
const CORRESP_ACC = "30101810500000000641";

const DEBIT_URL = "https://raw.githubusercontent.com/zarazakill/vznos/main/debit.ods";
const EE_URL = "https://raw.githubusercontent.com/zarazakill/vznos/main/ee.ods";

let cachedDebtMap = new Map();     // key: plotNumber (lowercase), value: DebtRecord
let cachedElectricityMap = new Map(); // key: plotNumber, value: ElectricityRecord

function formatMoney(amount) {
    return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
}

function formatNumber(v) {
    return v % 1 === 0 ? v.toString() : v.toFixed(2);
}

function numberToWords(amount) {
    let rub = Math.floor(amount);
    let kop = Math.round((amount - rub) * 100);
    let rubWord = "";
    if (rub % 100 >= 11 && rub % 100 <= 19) rubWord = "рублей";
    else if (rub % 10 === 1) rubWord = "рубль";
    else if (rub % 10 >= 2 && rub % 10 <= 4) rubWord = "рубля";
    else rubWord = "рублей";
    return `${rub} ${rubWord} ${kop.toString().padStart(2, '0')} копеек`;
}

function isPlotNumber(s) {
    return s.trim().match(/^\d{1,3}[а-яёa-z]?$/i) !== null;
}

function parseNumber(val) {
    if (val === undefined || val === null) return 0;
    const s = val.toString().replace(",", ".").replace(/[^\d.-]/g, '');
    if (s === "") return 0;
    const num = parseFloat(s);
    return isNaN(num) ? 0 : num;
}

// ==============================================================
// 2. ПАРСИНГ .ods ФАЙЛОВ (ЧЕРЕЗ JSZip + content.xml)
// ==============================================================
async function fetchAndParseOds(url, parserFn) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    const contentXml = await zip.file("content.xml").async("string");
    return parserFn(contentXml);
}

function parseDebitOds(xmlString) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "application/xml");
    const rows = doc.querySelectorAll("table|table-row");

    const result = new Map();
    let colPlot = 0, colOwner = 1, colDebt = 7, colOverpay = 8;
    let headerFound = false, dataStarted = false;
    let current = null;

    for (let i = 0; i < rows.length; i++) {
        const cells = expandRowCells(rows[i]);
        if (cells.length === 0) continue;
        const col0 = (cells[0] || "").trim();
        const col0lower = col0.toLowerCase();

        if (!headerFound) {
            const joined = cells.join(" ").toLowerCase();
            if (joined.includes("владельц") || joined.includes("номер")) {
                cells.forEach((v, idx) => {
                    const vLower = v.toLowerCase();
                    if (vLower === "номер" || v === "№") colPlot = idx;
                    if (vLower.includes("владельц")) colOwner = idx;
                });
                headerFound = true;
            }
            continue;
        }

        if (!dataStarted) {
            if (isPlotNumber(col0)) dataStarted = true;
            else continue;
        }

        if (col0lower === "итого" || col0lower.startsWith("итог")) break;
        if (col0 === "") continue;

        const isPlotRow = isPlotNumber(col0) && cells[colOwner] && cells[colOwner].trim() !== "";

        if (isPlotRow) {
            if (current && current.totalDebt > 0.01) result.set(current.plotNumber, current);

            const plotKey = col0.toLowerCase();
            const owner = (cells[colOwner] || "").trim();
            const debtEnd = parseNumber(cells[colDebt]);
            const overpayEnd = parseNumber(cells[colOverpay]);

            current = {
                plotNumber: plotKey,
                owner: owner,
                totalDebt: debtEnd,
                overpayEnd: overpayEnd,
                hasDebt: debtEnd > 0.01,
                hasOverpayment: overpayEnd > 0.01,
                membershipDebt: 0,
                targetDebt: 0,
                arrearsDebt: 0,
                workDebt: 0,
                electricityDebt: 0,
                details: []
            };
        } else if (current && col0 !== "") {
            const categoryName = col0;
            const amount = parseNumber(cells[colDebt]);
            if (amount > 0.01) {
                if (categoryName.includes("Членские взносы")) {
                    current.membershipDebt += amount;
                    current.details.push({ label: categoryName, amount: amount, cat: "membership" });
                } else if (categoryName.includes("Целевые")) {
                    current.targetDebt += amount;
                    current.details.push({ label: categoryName, amount: amount, cat: "target" });
                } else if (categoryName.includes("Задолженность прошлых лет") && !categoryName.includes("Отработка") && !categoryName.includes("Целевые")) {
                    current.arrearsDebt += amount;
                    current.details.push({ label: categoryName, amount: amount, cat: "arrears" });
                } else if (categoryName.includes("Отработка")) {
                    current.workDebt += amount;
                    current.details.push({ label: categoryName, amount: amount, cat: "work" });
                } else if (categoryName.includes("Электроэнергия")) {
                    current.electricityDebt += amount;
                    current.details.push({ label: categoryName, amount: amount, cat: "electricity" });
                }
            }
        }
    }
    if (current && current.totalDebt > 0.01) result.set(current.plotNumber, current);
    console.log(`Debit loaded: ${result.size} участков`);
    return result;
}

function parseElectricityOds(xmlString) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "application/xml");
    const rows = doc.querySelectorAll("table|table-row");
    const result = new Map();
    let headerFound = false;

    for (let i = 0; i < rows.length; i++) {
        const cells = expandRowCells(rows[i]);
        if (cells.length === 0) continue;
        const col0 = (cells[0] || "").trim();

        if (!headerFound) {
            const c0l = col0.toLowerCase();
            if (c0l.includes("участок") || c0l.includes("номер") || c0l === "№" || isPlotNumber(col0)) {
                headerFound = true;
                if (!isPlotNumber(col0)) continue;
            } else continue;
        }
        if (!isPlotNumber(col0)) continue;

        const plotKey = col0.toLowerCase();
        const owner = (cells[1] || "").trim();
        const readingDateStr = (cells[4] || "").trim();
        const currentReading = parseNumber(cells[6]);

        result.set(plotKey, {
            plotNumber: plotKey,
            owner: owner,
            currentReading: currentReading,
            readingDateStr: readingDateStr,
            tariff: TARIFF
        });
    }
    console.log(`Electricity loaded: ${result.size} записей`);
    return result;
}

function expandRowCells(rowElement) {
    const cells = [];
    const children = rowElement.children;
    for (let i = 0; i < children.length; i++) {
        const cell = children[i];
        if (cell.nodeName !== "table:table-cell" && cell.nodeName !== "table:covered-table-cell") continue;
        let repeat = 1;
        if (cell.hasAttribute("table:number-columns-repeated")) {
            repeat = parseInt(cell.getAttribute("table:number-columns-repeated")) || 1;
        }
        let text = "";
        const p = cell.querySelector("text|p");
        if (p) text = p.textContent || "";
        text = text.trim();
        for (let r = 0; r < Math.min(repeat, 30); r++) cells.push(text);
    }
    return cells;
}

// ==============================================================
// 3. QR-ГЕНЕРАЦИЯ (ПОЛНОСТЬЮ СООТВЕТСТВУЕТ QrReceiptGenerator.kt)
// ==============================================================
function sanitizePurpose(text) {
    return text.replace(/[|;,\n\r\t]/g, ' ').replace(/\s+/g, ' ').trim();
}

function formatAmountShort(amount) {
    if (amount === Math.floor(amount)) return Math.floor(amount).toString();
    let str = amount.toFixed(2).replace('.', ',');
    str = str.replace(/0+$/, '').replace(/,$/, '');
    return str;
}

function buildDetailedPurpose(debt) {
    const parts = [];
    if (debt.membershipDebt > 0.01) parts.push(`Членские взносы: ${formatAmountShort(debt.membershipDebt)}р`);
    if (debt.targetDebt > 0.01) parts.push(`Целевые взносы: ${formatAmountShort(debt.targetDebt)}р`);
    if (debt.arrearsDebt > 0.01) parts.push(`Задолженность прошлых лет: ${formatAmountShort(debt.arrearsDebt)}р`);
    if (debt.workDebt > 0.01) parts.push(`Отработка: ${formatAmountShort(debt.workDebt)}р`);
    if (debt.electricityDebt > 0.01) parts.push(`Электроэнергия: ${formatAmountShort(debt.electricityDebt)}р`);

    let ownerShort = debt.owner || "";
    if (ownerShort.length > 20) ownerShort = ownerShort.substring(0, 17) + "…";
    const suffix = ownerShort ? ` уч.${debt.plotNumber} ${ownerShort}` : ` уч.${debt.plotNumber}`;
    let result = parts.join(", ") + suffix;
    if (result.length > 210) result = `Оплата взносов уч.${debt.plotNumber}`;
    return result;
}

function buildPaymentQR(plotNumber, amount, debtData, isElectricity = false) {
    const sumKop = Math.round(amount * 100);
    let finalPurpose;
    if (isElectricity) finalPurpose = `Электроэнергия ${formatAmountShort(amount)}р уч.${plotNumber}`;
    else if (debtData) finalPurpose = buildDetailedPurpose(debtData);
    else finalPurpose = `Оплата взносов уч.${plotNumber}`;

    const cleanPurpose = sanitizePurpose(finalPurpose);
    return `ST00012|Name=${ORGANIZATION}|PersonalAcc=${PERSONAL_ACC}|BankName=${BANK_NAME}|BIC=${BIC}|CorrespAcc=${CORRESP_ACC}|PayeeINN=${INN}|Purpose=${cleanPurpose}|Sum=${sumKop}`;
}

async function generateQR(text) {
    return await QRCode.toDataURL(text, { width: 280, margin: 1, errorCorrectionLevel: 'H' });
}

// ==============================================================
// 4. ЗАГРУЗКА ДАННЫХ (С КЭШИРОВАНИЕМ)
// ==============================================================
async function loadPlotData(plotNumber) {
    const normalized = plotNumber.trim().toLowerCase();
    const debtContainer = document.getElementById("debtCard");
    const eeContainer = document.getElementById("electricityCard");
    const notFoundDiv = document.getElementById("notFoundBlock");
    const loadingDiv = document.getElementById("loadingIndicator");
    const errorDiv = document.getElementById("errorMessage");

    debtContainer.classList.add("hidden");
    eeContainer.classList.add("hidden");
    notFoundDiv.classList.add("hidden");
    errorDiv.classList.add("hidden");
    loadingDiv.classList.remove("hidden");

    try {
        if (cachedDebtMap.size === 0) {
            loadingDiv.innerHTML = "☁️ Загрузка данных по долгам...";
            cachedDebtMap = await fetchAndParseOds(DEBIT_URL, parseDebitOds);
            loadingDiv.innerHTML = "⚡ Загрузка данных электроэнергии...";
            cachedElectricityMap = await fetchAndParseOds(EE_URL, parseElectricityOds);
        }
        loadingDiv.classList.add("hidden");

        const debtData = cachedDebtMap.get(normalized);
        const eeData = cachedElectricityMap.get(normalized);

        if (!debtData && !eeData) {
            notFoundDiv.classList.remove("hidden");
            return;
        }
        if (debtData) renderDebtCard(debtData);
        else debtContainer.classList.add("hidden");
        if (eeData) renderElectricityCard(eeData);
        else eeContainer.classList.add("hidden");
    } catch (err) {
        loadingDiv.classList.add("hidden");
        errorDiv.innerHTML = `❌ Ошибка загрузки: ${err.message}. Проверьте интернет.`;
        errorDiv.classList.remove("hidden");
        console.error(err);
    }
}

// ==============================================================
// 5. ОТРИСОВКА КАРТОЧЕК
// ==============================================================
function renderDebtCard(debt) {
    const container = document.getElementById("debtCard");
    container.classList.remove("hidden");
    let html = `<div class="card-content"><div class="card-header">💰 Задолженность</div>
        <div style="font-size:13px; color:var(--gray-500);">Участок №${debt.plotNumber}</div>
        <div class="plot-owner">${debt.owner || "Владелец не указан"}</div>`;
    if (debt.hasDebt) {
        html += `<div class="debt-total amount-red">Задолженность: ${formatMoney(debt.totalDebt)} ₽</div>
            <div style="margin-top: 8px;">`;
        if (debt.membershipDebt > 0.01) html += `<div class="debt-line"><span>Членские взносы:</span><span class="amount-red">${formatMoney(debt.membershipDebt)} ₽</span></div>`;
        if (debt.targetDebt > 0.01) html += `<div class="debt-line"><span>Целевые взносы:</span><span class="amount-red">${formatMoney(debt.targetDebt)} ₽</span></div>`;
        if (debt.arrearsDebt > 0.01) html += `<div class="debt-line"><span>Задолженность прошлых лет:</span><span class="amount-red">${formatMoney(debt.arrearsDebt)} ₽</span></div>`;
        if (debt.workDebt > 0.01) html += `<div class="debt-line"><span>Отработка:</span><span class="amount-red">${formatMoney(debt.workDebt)} ₽</span></div>`;
        if (debt.electricityDebt > 0.01) html += `<div class="debt-line"><span>Электроэнергия:</span><span class="amount-red">${formatMoney(debt.electricityDebt)} ₽</span></div>`;
        html += `</div><div style="font-size:12px; margin:10px 0;">Прописью: ${numberToWords(debt.totalDebt)}</div>`;
        const qrText = buildPaymentQR(debt.plotNumber, debt.totalDebt, debt, false);
        html += `<button class="qr-btn" data-qr-text="${qrText.replace(/'/g, "\\'")}" data-type="debt">📱 Сгенерировать QR для оплаты</button>
            <div id="debtQrContainer" style="text-align:center;"></div>
            <div id="debtQrButtons" style="display:none;" class="qr-group">
                <button onclick="shareQR('debtQrImg')">↗ Поделиться</button>
                <button onclick="saveQR('debtQrImg')">💾 Сохранить</button>
            </div>`;
    } else if (debt.hasOverpayment) {
        html += `<div class="debt-total amount-green">Переплата: ${formatMoney(debt.overpayEnd)} ₽</div>`;
    } else {
        html += `<div class="debt-total amount-green">✓ Задолженностей нет</div>`;
    }
    html += `</div>`;
    container.innerHTML = html;

    const btn = container.querySelector('.qr-btn');
    if (btn) btn.addEventListener('click', (e) => generateAndShowQR('debt', btn, btn.dataset.qrText));
}

function renderElectricityCard(ee) {
    const container = document.getElementById("electricityCard");
    container.classList.remove("hidden");
    let html = `<div class="card-content"><div class="card-header">⚡ Электроэнергия</div>
        <div style="font-size:13px;">Участок №${ee.plotNumber}</div>
        <div class="plot-owner">${ee.owner || "Владелец не указан"}</div>
        <div style="display:flex; justify-content:space-between; margin:8px 0;">
            <span>Текущие показания:</span><strong>${formatNumber(ee.currentReading)} кВт·ч</strong>
        </div>
        <div style="font-size:12px; color:gray;">Дата: ${ee.readingDateStr || "не указана"}</div>
        <div style="font-size:12px; margin:4px 0 12px;">💰 Тариф: ${TARIFF.toFixed(2)} ₽/кВт·ч</div>
        <input type="number" id="newReadingInput" class="reading-input" placeholder="Введите новые показания" step="any">
        <div id="calcAmountBlock" class="calculated-amount hidden"></div>
        <button id="genEeQrBtn" class="qr-btn" disabled>📱 QR для оплаты э/э</button>
        <div id="eeQrContainer" style="text-align:center;"></div>
        <div id="eeQrButtons" style="display:none;" class="qr-group">
            <button onclick="shareQR('eeQrImg')">↗ Поделиться</button>
            <button onclick="saveQR('eeQrImg')">💾 Сохранить</button>
        </div>
    </div>`;
    container.innerHTML = html;

    const input = document.getElementById("newReadingInput");
    const calcBlock = document.getElementById("calcAmountBlock");
    const genBtn = document.getElementById("genEeQrBtn");

    input.addEventListener("input", function() {
        const newVal = parseFloat(this.value);
        if (isNaN(newVal) || newVal <= ee.currentReading) {
            calcBlock.classList.add("hidden");
            genBtn.disabled = true;
            return;
        }
        const amount = (newVal - ee.currentReading) * TARIFF;
        calcBlock.innerHTML = `📊 Сумма к оплате: ${formatMoney(amount)} ₽`;
        calcBlock.classList.remove("hidden");
        genBtn.disabled = false;
        genBtn.onclick = async () => {
            const qrText = buildPaymentQR(ee.plotNumber, amount, null, true);
            await generateAndShowQR('ee', genBtn, qrText);
        };
    });
}

async function generateAndShowQR(type, btn, qrText) {
    const containerId = type === 'debt' ? 'debtQrContainer' : 'eeQrContainer';
    const btnGroupId = type === 'debt' ? 'debtQrButtons' : 'eeQrButtons';
    const container = document.getElementById(containerId);
    const oldImg = document.getElementById(`${type}QrImg`);
    if (oldImg) oldImg.remove();

    btn.innerText = "⏳ Генерация...";
    btn.disabled = true;
    try {
        const qrDataUrl = await generateQR(qrText);
        const img = document.createElement('img');
        img.id = `${type}QrImg`;
        img.src = qrDataUrl;
        img.className = "qr-image";
        container.appendChild(img);
        document.getElementById(btnGroupId).style.display = "flex";
    } catch(e) { alert("Ошибка QR: " + e.message); }
    finally { btn.innerText = type === 'debt' ? "Обновить QR" : "Сгенерировать QR"; btn.disabled = false; }
}

window.shareQR = async function(imgId) {
    const img = document.getElementById(imgId);
    if (!img) return;
    const blob = await fetch(img.src).then(r => r.blob());
    const file = new File([blob], "qr.png", { type: "image/png" });
    if (navigator.share) navigator.share({ files: [file], title: "QR-код оплаты" });
    else {
        const link = document.createElement('a');
        link.download = "qr_payment.png";
        link.href = img.src;
        link.click();
    }
};
window.saveQR = function(imgId) {
    const img = document.getElementById(imgId);
    if (!img) return;
    const link = document.createElement('a');
    link.download = "qr_payment.png";
    link.href = img.src;
    link.click();
};

// ==============================================================
// 6. СОГЛАСИЕ НА ОБРАБОТКУ ПД (ФЗ-152)
// ==============================================================
function isConsentAccepted() {
    return localStorage.getItem(CONSENT_STORAGE_KEY) === "true" && localStorage.getItem(CONSENT_VERSION_KEY) === CONSENT_VERSION;
}
function saveConsent() {
    localStorage.setItem(CONSENT_STORAGE_KEY, "true");
    localStorage.setItem(CONSENT_VERSION_KEY, CONSENT_VERSION);
}
function revokeConsent() {
    localStorage.removeItem(CONSENT_STORAGE_KEY);
    localStorage.removeItem(CONSENT_VERSION_KEY);
    cachedDebtMap.clear();
    cachedElectricityMap.clear();
    location.reload();
}

            <div class="consent-body">
                <div style="margin-bottom:16px; font-size:14px;">Садоводческое некоммерческое товарищество «Берёзка-2» (ИНН 5433118499) является оператором персональных данных.</div>
                <div class="consent-section"><div class="consent-section-title">🔐 Персональные данные</div>
                    <ul class="data-list"><li>Номер земельного участка</li><li>Фамилия, имя, отчество члена СНТ</li><li>Сведения о задолженностях</li><li>Показания электроэнергии</li></ul>
                    <div class="consent-check-row"><input type="checkbox" id="consentCheckPersonal"><label>Я согласен(а) на обработку моих персональных данных в соответствии с ФЗ-152</label></div>
                </div>
                <div class="consent-section"><div class="consent-section-title">📋 Пользовательское соглашение</div>
                    <ul class="data-list"><li>Приложение предоставляется «как есть»</li><li>Данные носят информационный характер</li><li>Запрещена передача доступа третьим лицам</li></ul>
                    <div class="consent-check-row"><input type="checkbox" id="consentCheckTerms"><label>Я принимаю условия Пользовательского соглашения и Политики конфиденциальности</label></div>
                </div>
                <div class="consent-section"><div class="consent-section-title">👤 Подтверждение</div>
                    <div class="consent-check-row"><input type="checkbox" id="consentCheckAge"><label>Мне исполнилось 18 лет, я являюсь членом СНТ или его представителем</label></div>
                </div>
            </div>
            <div class="consent-footer">
                <button class="btn-consent-accept" id="consentAcceptBtn" disabled>✓ Принять и продолжить</button>
                <button class="btn-consent-decline" id="consentDeclineBtn">Отказаться и закрыть</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);
    const c1 = document.getElementById('consentCheckPersonal'), c2 = document.getElementById('consentCheckTerms'), c3 = document.getElementById('consentCheckAge');
    const acceptBtn = document.getElementById('consentAcceptBtn');
    function update() { acceptBtn.disabled = !(c1.checked && c2.checked && c3.checked); }
    c1.onchange = c2.onchange = c3.onchange = update;
    document.getElementById('consentAcceptBtn').onclick = () => { saveConsent(); overlay.remove(); document.getElementById('mainApp').style.display = ''; initMainApp(); };
    document.getElementById('consentDeclineBtn').onclick = () => { if(confirm('Без согласия использование невозможно. Закрыть?')) window.close(); };
}

function showSettingsModal() {
    const modal = document.createElement('div');
    modal.className = 'consent-overlay';
    modal.innerHTML = `<div class="consent-modal"><div class="consent-header" style="background:var(--gray-800);"><h2>⚙️ Настройки</h2><button style="position:absolute;right:16px;top:16px;background:none;border:none;color:white;font-size:24px;cursor:pointer;" id="closeSettingsModal">×</button></div>
        <div class="consent-body"><div class="setting-row"><div class="setting-label"><p>Статус согласия</p><small>ФЗ-152</small></div><div><span class="consent-status accepted">✓ Согласие принято</span></div></div>
        <div class="setting-row"><div class="setting-label"><p>Отозвать согласие</p><small>После отзыва приложение запросит повторное согласие</small></div><button class="btn-revoke" id="revokeConsentBtn">Отозвать</button></div>
        <div class="setting-row"><div class="setting-label"><p>Очистить кэш данных</p><small>Удаляет загруженные данные об участках</small></div><button class="btn-revoke" id="clearCacheBtn" style="background:var(--red-600);">Очистить</button></div></div>
        <div class="consent-footer"><button class="btn-consent-accept" id="closeSettingsBtn" style="background:var(--gray-600);">Закрыть</button></div></div>`;
    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector('#closeSettingsModal').onclick = close;
    modal.querySelector('#closeSettingsBtn').onclick = close;
    modal.querySelector('#revokeConsentBtn').onclick = () => { if(confirm('Отозвать согласие?')) revokeConsent(); };
    modal.querySelector('#clearCacheBtn').onclick = () => { cachedDebtMap.clear(); cachedElectricityMap.clear(); alert('Кэш очищен'); close(); };
}

function initMainApp() {
    document.getElementById("searchBtn").addEventListener("click", () => { const v = document.getElementById("plotInput").value; if(v.trim()) loadPlotData(v); else alert("Введите номер участка"); });
    document.getElementById("plotInput").addEventListener("keypress", (e) => { if(e.key === "Enter") document.getElementById("searchBtn").click(); });
    document.getElementById("settingsBtn").addEventListener("click", showSettingsModal);
}

if (isConsentAccepted()) { document.getElementById('mainApp').style.display = ''; initMainApp(); }
else { showConsentScreen(); }

// Service Worker Registration
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW error:', e)); });
}
</script>
